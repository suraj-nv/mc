{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Password</title>

    <link rel="stylesheet"
        href="{% static 'accounts/password.css' %}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <a href="{% url 'index' %}"
            class="back">
            &#10094;
        </a>

        <div class="profile-image">
            <img src="{% static 'accounts/profile.jpg' %}"
                alt="">
        </div>

        <!-- Username from Django -->
        <h1>polleykalicharan</h1>

        <form method="POST">
            {% csrf_token %}

            <div class="password-box">

                <input type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required>

                <i class="fa-regular fa-eye toggle-password"
                    onclick="togglePassword()"></i>

            </div>

            <button type="submit">
                Log in
            </button>

        </form>

        <a href="{% url 'forgot_password' %}"
            class="forgot">
            Forgot password? </a>

        <div class="footer">
            <img src="{% static 'accounts/meta.png' %}"
                alt="Meta">
            <span>Meta</span>
        </div>

    </div>

    <script>

        function togglePassword() {

            const password = document.getElementById("password");
            const eye = document.querySelector(".toggle-password");

            if (password.type === "password") {
                password.type = "text";
                eye.classList.remove("fa-eye");
                eye.classList.add("fa-eye-slash");
            } else {
                password.type = "password";
                eye.classList.remove("fa-eye-slash");
                eye.classList.add("fa-eye");
            }

        }

    </script>

</body>

</html>
