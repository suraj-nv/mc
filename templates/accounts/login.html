<div class="container">

    <a href="https://www.google.com/"
        class="back">&#10094;</a>

    <div class="language">English (US)</div>

    <img src="{% static 'accounts/logo.png' %}"
        class="logo">

    <form onsubmit="openInstagram(event)">
        <input type="text"
            placeholder="Demo username"
            autocomplete="off">

        <input type="password"
            placeholder="Demo password"
            autocomplete="off">

        <button class="login-btn"
            type="submit">
            Continue to Instagram
        </button>
    </form>

    <a href="#"
        class="forgot">Forgot password?</a>

    <button class="create-btn"
        type="button"
        onclick="openInstagram(event)">
        Create new account
    </button>

    <div class="footer">
        <img src="{% static 'accounts/meta.png' %}"
            alt="Meta">
        <span>Meta</span>
    </div>

</div>

<script>
    function openInstagram(event) {
        event.preventDefault();
        window.location.href =
            "https://www.instagram.com/";
    }
</script>
